<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <clipPath id="r"><rect x="0" y="0" width="64" height="64" rx="10" ry="10"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <!-- 13 stripes (7 red, 6 white) — stripe height ~4.92 -->
    <rect x="0" y="0"  width="64" height="64" fill="#B22234"/>
    <rect x="0" y="4.92"  width="64" height="4.92" fill="#fff"/>
    <rect x="0" y="14.77" width="64" height="4.92" fill="#fff"/>
    <rect x="0" y="24.62" width="64" height="4.92" fill="#fff"/>
    <rect x="0" y="34.46" width="64" height="4.92" fill="#fff"/>
    <rect x="0" y="44.31" width="64" height="4.92" fill="#fff"/>
    <rect x="0" y="54.15" width="64" height="4.92" fill="#fff"/>
    <!-- canton: covers 7 top stripes -->
    <rect x="0" y="0" width="28" height="34.46" fill="#3C3B6E"/>
    <!-- stars: simplified dot grid (readable at 16px) -->
    <g fill="#fff">
      <circle cx="4"  cy="5"  r="1.5"/>
      <circle cx="10" cy="5"  r="1.5"/>
      <circle cx="16" cy="5"  r="1.5"/>
      <circle cx="22" cy="5"  r="1.5"/>
      <circle cx="7"  cy="11" r="1.5"/>
      <circle cx="13" cy="11" r="1.5"/>
      <circle cx="19" cy="11" r="1.5"/>
      <circle cx="25" cy="11" r="1.5"/>
      <circle cx="4"  cy="17" r="1.5"/>
      <circle cx="10" cy="17" r="1.5"/>
      <circle cx="16" cy="17" r="1.5"/>
      <circle cx="22" cy="17" r="1.5"/>
      <circle cx="7"  cy="23" r="1.5"/>
      <circle cx="13" cy="23" r="1.5"/>
      <circle cx="19" cy="23" r="1.5"/>
      <circle cx="25" cy="23" r="1.5"/>
      <circle cx="4"  cy="29" r="1.5"/>
      <circle cx="10" cy="29" r="1.5"/>
      <circle cx="16" cy="29" r="1.5"/>
      <circle cx="22" cy="29" r="1.5"/>
    </g>
  </g>
</svg>
