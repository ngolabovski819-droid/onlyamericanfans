<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <clipPath id="clip"><rect width="32" height="32" rx="6"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <!-- Red background = 7 red stripes -->
    <rect width="32" height="32" fill="#B22234"/>
    <!-- 6 white stripes -->
    <rect y="2.46"  width="32" height="2.46" fill="#FFFFFF"/>
    <rect y="7.38"  width="32" height="2.46" fill="#FFFFFF"/>
    <rect y="12.31" width="32" height="2.46" fill="#FFFFFF"/>
    <rect y="17.23" width="32" height="2.46" fill="#FFFFFF"/>
    <rect y="22.15" width="32" height="2.46" fill="#FFFFFF"/>
    <rect y="27.07" width="32" height="2.46" fill="#FFFFFF"/>
    <!-- Blue canton -->
    <rect x="0" y="0" width="13" height="17.23" fill="#3C3B6E"/>
    <!-- White star -->
    <polygon points="6.5,3.5 7.4,6.5 10.5,6.5 8.1,8.3 9.0,11.2 6.5,9.5 4.0,11.2 4.9,8.3 2.5,6.5 5.6,6.5" fill="#FFFFFF"/>
  </g>
</svg>
